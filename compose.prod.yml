services:

  # ── Application database ──────────────────────────────────────────────────────
  app-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Keycloak database ─────────────────────────────────────────────────────────
  kc-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${KC_POSTGRES_DB}
      POSTGRES_USER:     ${KC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
    volumes:
      - kc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_POSTGRES_USER} -d ${KC_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Keycloak identity provider ─────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start --optimized
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://kc-db:5432/${KC_POSTGRES_DB}
      KC_DB_USERNAME:          ${KC_POSTGRES_USER}
      KC_DB_PASSWORD:          ${KC_POSTGRES_PASSWORD}
      KC_HOSTNAME_URL:         https://${DOMAIN}/auth
      KC_PROXY:                edge
      KC_HTTP_ENABLED:         "true"
    depends_on:
      kc-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal

  # ── Database migrations init container ────────────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/migrate"]
    restart: "no"
    environment:
      DATABASE_URL:         postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/${POSTGRES_DB}?sslmode=disable
      OIDC_ISSUER:          placeholder
      OIDC_ISSUER_INTERNAL: placeholder
      OIDC_CLIENT_ID:       placeholder
      OIDC_CLIENT_SECRET:   placeholder
      OIDC_REDIRECT_URL:    placeholder
      FRONTEND_URL:         placeholder
      SESSION_SECRET:       ${SESSION_SECRET}
      COOKIE_HASH_KEY:      ${COOKIE_HASH_KEY}
      COOKIE_ENCRYPT_KEY:   ${COOKIE_ENCRYPT_KEY}
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - internal

  # ── Go backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:         postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/${POSTGRES_DB}?sslmode=disable
      OIDC_ISSUER:          https://${DOMAIN}/auth/realms/rosetta
      OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/rosetta
      OIDC_CLIENT_ID:       ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET:   ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL:    https://${DOMAIN}/api/auth/callback
      FRONTEND_URL:         https://${DOMAIN}
      SESSION_SECRET:       ${SESSION_SECRET}
      COOKIE_HASH_KEY:      ${COOKIE_HASH_KEY}
      COOKIE_ENCRYPT_KEY:   ${COOKIE_ENCRYPT_KEY}
      BACKEND_PORT:         "8090"
      APP_ENV:              production
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks:
      - internal

  # ── React frontend (pre-built static files served by nginx) ──────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro      # TLS certificates (gitignored)
    depends_on:
      - backend
      - frontend
      - keycloak
    networks:
      - internal
      - external

networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  app_db_data:
  kc_db_data:

services:

  # ── Application database ──────────────────────────────────────────────────────
  app-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak database (kept separate from app DB to mirror production) ─────────
  kc-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${KC_POSTGRES_DB}
      POSTGRES_USER:     ${KC_POSTGRES_USER}
      POSTGRES_PASSWORD: ${KC_POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - kc_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_POSTGRES_USER} -d ${KC_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Keycloak identity provider ─────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://kc-db:5432/${KC_POSTGRES_DB}
      KC_DB_USERNAME:          ${KC_POSTGRES_USER}
      KC_DB_PASSWORD:          ${KC_POSTGRES_PASSWORD}
      # Makes Keycloak advertise localhost:8080 as its issuer so both the browser
      # and the backend (via InsecureIssuerURLContext) agree on the issuer claim.
      KC_HOSTNAME_URL:         http://localhost:8080
      KC_HOSTNAME_ADMIN_URL:   http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/themes/rosetta:/opt/keycloak/themes/rosetta:ro
    depends_on:
      kc-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/rosetta/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ── Database migrations + initial seed (runs once, then exits) ───────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "go run ./cmd/migrate up && go run ./cmd/migrate seed && ([ -f /app/resources/Deutch_verbs_and_conjugations.csv ] && go run ./cmd/migrate seed-conjugations || true) && go run ./cmd/migrate seed-audio"]
    environment:
      DATABASE_URL:   postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/${POSTGRES_DB}?sslmode=disable
      # Required by config.Load() — supply minimal values
      OIDC_ISSUER:             placeholder
      OIDC_ISSUER_INTERNAL:    placeholder
      OIDC_CLIENT_ID:          placeholder
      OIDC_CLIENT_SECRET:      placeholder
      OIDC_REDIRECT_URL:       placeholder
      FRONTEND_URL:            placeholder
      KEYCLOAK_ADMIN:          placeholder
      KEYCLOAK_ADMIN_PASSWORD: placeholder
      SESSION_SECRET:       ${SESSION_SECRET}
      COOKIE_HASH_KEY:      ${COOKIE_HASH_KEY}
      COOKIE_ENCRYPT_KEY:   ${COOKIE_ENCRYPT_KEY}
      # Paths to CSV files inside the container (see resources/ mount below).
      # Set FORCE_RESEED=true / FORCE_RESEED_CONJ=true to truncate and reload.
      SEED_FILE:         /app/resources/Deutch.csv
      FORCE_RESEED:      "false"
      CONJ_SEED_FILE:    /app/resources/Deutch_verbs_and_conjugations.csv
      FORCE_RESEED_CONJ: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      AUDIO_DIR:         /app/resources/audio
      FORCE_RESEED_AUDIO: "false"
    volumes:
      - ./backend:/app
      - ./resources:/app/resources
      - ./credentials:/run/secrets:ro
      - go_module_cache:/root/go/pkg/mod
    depends_on:
      app-db:
        condition: service_healthy

  # ── Go backend (Air hot-reload) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL:         postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@app-db:5432/${POSTGRES_DB}?sslmode=disable
      OIDC_ISSUER:          http://localhost:8080/realms/rosetta
      OIDC_ISSUER_INTERNAL: http://keycloak:8080/realms/rosetta
      OIDC_CLIENT_ID:       ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET:   ${OIDC_CLIENT_SECRET}
      OIDC_REDIRECT_URL:    http://localhost:8090/api/auth/callback
      FRONTEND_URL:         http://localhost:5173
      SESSION_SECRET:       ${SESSION_SECRET}
      COOKIE_HASH_KEY:      ${COOKIE_HASH_KEY}
      COOKIE_ENCRYPT_KEY:   ${COOKIE_ENCRYPT_KEY}
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      BACKEND_PORT:            "8090"
      APP_ENV:                 development
      CAP_API_URL:             http://cap-mock:3000
      CAP_SECRET_KEY:          ${CAP_SECRET_KEY}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
      GOOGLE_TTS_VOICE:        "de-DE-Neural2-F"
      AUDIO_DIR:               /app/resources/audio
      AUDIO_BASE_URL:          "/static/audio/"
      VALKEY_ADDR:             "valkey:6379"
    ports:
      - "8090:8090"
    volumes:
      - ./backend:/app
      - ./resources:/app/resources
      - ./credentials:/run/secrets:ro
      - go_module_cache:/root/go/pkg/mod
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      cap-mock:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # ── Valkey (Redis-compatible) — state store for Cap ──────────────────────────
  valkey:
    image: valkey/valkey:9-alpine
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Cap self-hosted CAPTCHA server ────────────────────────────────────────────
  cap:
    image: tiago2/cap:latest
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY}
      REDIS_URL: redis://valkey:6379
    ports:
      - "3001:3000"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun --eval \"fetch('http://localhost:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Cap mock — returns {success:true} for any /siteverify call (dev only) ─────
  cap-mock:
    image: node:22-alpine
    command: >-
      node -e "
      require('http').createServer((req,res)=>{
        res.writeHead(200,{'Content-Type':'application/json'});
        res.end('{\"success\":true}');
      }).listen(3000,()=>console.log('cap-mock: ready'));
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── React frontend (Vite dev server) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_BACKEND_URL:      http://backend:8090
      VITE_CAP_SERVER_URL:   http://cap:3000
      VITE_CAP_SITE_KEY:     ${VITE_CAP_SITE_KEY}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # Prevent host node_modules from overriding container's
    depends_on:
      backend:
        condition: service_started
      cap:
        condition: service_healthy

volumes:
  app_db_data:
  kc_db_data:
  go_module_cache:
  valkey_data:

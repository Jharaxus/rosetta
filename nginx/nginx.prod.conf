upstream backend  { server backend:8090;  keepalive 32; }
upstream frontend { server frontend:80;   keepalive 32; }
upstream keycloak { server keycloak:8080; keepalive 32; }

# Rate limiting zones — applied per client IP
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=global_zone:20m rate=60r/m;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "DENY" always;
    add_header X-Content-Type-Options       "nosniff" always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy      "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    client_header_timeout       10s;
    client_body_timeout         10s;
    send_timeout                30s;
    keepalive_timeout           65s;
    proxy_connect_timeout       5s;
    proxy_send_timeout          30s;
    proxy_read_timeout          30s;
    client_max_body_size        1m;

    # ── Keycloak — only expose OIDC endpoints, block admin console ───────────
    # Admin console must NEVER be accessible from the public internet.
    location ~ ^/auth/(admin|master|realms/master) {
        return 403;
    }

    location /auth/ {
        proxy_pass          http://keycloak/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    X-Forwarded-Host  $host;
    }

    # ── Go API — rate limit auth endpoints ───────────────────────────────────
    location ~ ^/api/auth/(login|callback) {
        limit_req           zone=auth_zone burst=5 nodelay;
        limit_req_status    429;

        proxy_pass          http://backend;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req           zone=global_zone burst=20 nodelay;
        limit_req_status    429;

        proxy_pass          http://backend;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── React SPA (catch-all) ────────────────────────────────────────────────
    location / {
        proxy_pass          http://frontend;
        proxy_set_header    Host $host;
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: any unknown path returns index.html so react-router handles it
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — cache aggressively (content-addressed by Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access logs for health checks
    location /healthz {
        return 200 "ok";
        access_log off;
    }
}
